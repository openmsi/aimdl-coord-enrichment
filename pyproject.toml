[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "helix_dagster"
version = "0.2.0"
description = "Dagster pipeline for HELIX experiment metadata extraction and enrichment"
dependencies = [
    "dagster",
    "dagster-webserver",
    "girder-client>=3.1.20",
    "pandas",
    "openpyxl",
    "coordinate-transformer",
]

[project.optional-dependencies]
dev = ["pytest", "dagster[test]"]

[tool.setuptools.packages.find]
include = ["helix_dagster*"]

[tool.dagster]
module_name = "helix_dagster"
