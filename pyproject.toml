[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aimdl_coord_enrichment"
version = "0.6.0"
description = "Dagster pipeline for HELIX experiment metadata extraction and enrichment"
dependencies = [
    "dagster",
    "dagster-webserver",
    "girder-client>=3.1.20",
    "pandas",
    "openpyxl",
    "coordinate-transformer>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["aimdl_coord_enrichment*"]

[tool.dagster]
module_name = "aimdl_coord_enrichment"
